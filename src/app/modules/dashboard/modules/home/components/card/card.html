<div class="w-full flex overflow-x-auto gap-2 pt-5 justify-items-center select-none">
    @for (item of data; track $index) {
    <div
        class="w-64 min-w-64 cursor-pointer flex flex-col gap-2 group transition-all duration-500 hover:bg-black/20 p-3 rounded-xl">
        <div class="relative w-full aspect-square overflow-hidden rounded-2xl">
            <img [src]="item.cover"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 group-hover:opacity-40"
                [alt]="'song-' + item.title + '-cover'">
            <div class="absolute inset-0 flex items-center justify-center
                       opacity-0 group-hover:opacity-100
                       transition-all duration-300 ease-out">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#fafafa" class="w-8 h-8">
                    <path fill-rule="evenodd"
                        d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
                        clip-rule="evenodd" />
                </svg>
            </div>
        </div>
        <div class="flex flex-col">
            <p class="font-medium truncate text-foreground">{{ item.title }}</p>
            @if (item.artist) {
            <p class="text-xs text-foreground/30 truncate">{{ item.artist }}</p>
            }
        </div>
    </div>
    }
</div>
