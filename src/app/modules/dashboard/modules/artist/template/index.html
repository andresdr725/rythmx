@if (loading) {
<artist-loader />
} @else {
<section class="w-full h-full flex flex-col gap-5 overflow-y-auto no-scrollbar select-none">
    <section>
        <div class="w-full h-[480px] relative overflow-hidden group shadow-lg rounded-xl bg-black">
            <img src="{{artist?.songs?.[0]?.thumbnail}}" alt="artist-bg-cover" class="w-full h-full object-cover">

            <div class="absolute inset-0 bg-linear-to-r from-black to-transparent pointer-events-none z-10"></div>

            <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-30">
                <div class="relative w-full max-w-xs group">
                    <input type="text" placeholder="Buscar..." class="w-full bg-white/10 backdrop-blur-md border border-white/10 text-white 
                    placeholder-white/70 rounded-full py-2.5 pl-5 pr-12 
                    focus:outline-none focus:bg-white/20 focus:border-white/30 
                    transition-all shadow-sm" />
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-white pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                        </svg>
                    </span>
                </div>
            </div>
            <div class="absolute bottom-0 left-0 w-full p-8 flex items-end z-20">
                <div class="flex flex-row gap-8 items-end w-full">
                    <div
                        class="relative w-56 h-56 shrink-0 rounded-lg shadow-[0_8px_24px_rgba(0,0,0,0.5)] overflow-hidden group/img">
                        <img [src]="artist?.thumbnail" alt="artist-cover" class="w-full h-full object-cover " />
                        <div class="absolute inset-0 bg-black/30"></div>
                    </div>

                    <div class="flex flex-col gap-2 mb-2 w-full">
                        <h1 class="text-8xl font-black tracking-tighter drop-shadow-xl leading-none -ml-1">
                            {{ artist?.name }}
                        </h1>

                        <p class="text-lg text-gray-200 mt-2 font-medium drop-shadow-md">
                            {{ artist?.subscribers }} Suscriptores
                        </p>

                        <div class="flex items-center gap-4 mt-4">
                            <button
                                class="w-14 h-14 bg-secondary/20 hover:bg-secondary/25 text-secondary rounded-full flex items-center justify-center transition-transform hover:scale-105 shadow-lg cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="w-7 h-7 ml-1">
                                    <path fill-rule="evenodd"
                                        d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
                                        clip-rule="evenodd" />
                                </svg>
                            </button>
                            <button
                                class="bg-white/10 hover:bg-white/20 backdrop-blur-sm text-foreground font-medium p-3  rounded-full  transition-all border border-white/10 hover:border-white/30 cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div
                class="absolute top-0 left-0 w-full h-32 bg-linear-to-b from-black/30 to-transparent pointer-events-none">
            </div>
        </div>
    </section>
</section>
}
